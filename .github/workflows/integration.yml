name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Docker Build & Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Python control plane
        run: docker compose build python-controlplane

      - name: Build frontend
        run: docker compose build frontend

      - name: Build Rust data plane
        run: docker compose build rust-dataplane

      - name: Build training workers
        run: docker compose build training-worker-0 training-worker-1

      - name: Start the full checkpoint stack
        run: |
          docker compose up -d \
            minio etcd rust-dataplane python-controlplane \
            training-worker-0 training-worker-1

      - name: Wait for a healthy control plane
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health | grep -q '"status":"HEALTHY"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100 python-controlplane rust-dataplane etcd minio
          exit 1

      - name: Run E2E tests
        env:
          E2E_REQUIRED: "1"
        run: |
          pip install httpx pytest
          PYTHONPATH=python-controlplane/src pytest tests/e2e/ -v -m e2e --tb=short

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
